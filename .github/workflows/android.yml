name: android
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --prefix app/hub
        if: hashFiles('app/hub/package-lock.json') != ''
      - run: make test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ariadne-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ariadne-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release (main -> prerelease apk-latest, v* tag -> that tag's release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Debug-signed build for sideloading (adb install -r ariadne-debug.apk). Commit ${GITHUB_SHA::7}."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ARIADNE $GITHUB_REF_NAME" --notes "$NOTES"
            gh release upload "$GITHUB_REF_NAME" ariadne-debug.apk --clobber
          else
            gh release delete apk-latest --cleanup-tag --yes 2>/dev/null || true
            gh release create apk-latest ariadne-debug.apk --prerelease --target "$GITHUB_SHA" --title "ARIADNE latest (main)" --notes "$NOTES"
          fi

  pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/web }
      - id: deploy
        uses: actions/deploy-pages@v4
